<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notes</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Notes%22%2C%22short_name%22%3A%22Notes%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%5D%7D" />
<meta name="theme-color" content="#000000" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #000; color: #EDEDED;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100%; overflow: hidden; }
  #root { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  button { font-family: inherit; color: #EDEDED; }
  .icon-btn { background: transparent; border: none; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #EDEDED; }
  .icon-btn svg { display: block; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; padding-top: max(16px, env(safe-area-inset-top)); }
  .header h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .list-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 14px 100px; }
  .empty { text-align: center; color: #5C5C5E; margin-top: 80px; font-size: 14px; }
  .card { background: #1C1C1E; border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; user-select: none; -webkit-user-select: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; touch-action: pan-y; }
  .card-text { flex: 1; min-width: 0; }
  .card-check { width: 26px; height: 26px; border-radius: 50%; background: #4A4A4C; flex-shrink: 0; display: none; align-items: center; justify-content: center; }
  .selecting .card-check { display: flex; }
  .card.selected .card-check { background: #E8A33D; }
  .card-check svg { opacity: 0; }
  .card.selected .card-check svg { opacity: 1; }
  .sel-header { display: none; align-items: center; justify-content: space-between; padding: 16px 16px 12px; padding-top: max(16px, env(safe-area-inset-top)); }
  .sel-header.active { display: flex; }
  .header.hidden { display: none; }
  .sel-count { font-size: 17px; font-weight: 500; }
  .sel-actions { display: flex; gap: 4px; align-items: center; }
  .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-body { font-size: 13px; color: #9A9A9E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px; }
  .card-date { font-size: 11px; color: #6B6B6E; }
  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); right: max(24px, calc((100vw - 480px) / 2 + 24px));
    width: 56px; height: 56px; border-radius: 50%; background: #E8A33D; border: none; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 4px 14px rgba(232,163,61,0.4); cursor: pointer; z-index: 10; }
  .fab svg { display: block; }
  .editor { display: none; flex-direction: column; height: 100%; }
  .editor.active { display: flex; }
  .list-view.hidden { display: none; }
  .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; padding-top: max(14px, env(safe-area-inset-top)); }
  .editor-date { font-size: 12px; color: #8A8A8E; }
  .editor-body { padding: 8px 20px; flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  #titleInput { background: transparent; border: none; outline: none; color: #fff; font-size: 22px; font-weight: 600; margin-bottom: 10px; width: 100%; }
  #bodyInput { background: transparent; border: none; outline: none; color: #D6D6D8; font-size: 16px; line-height: 1.5; resize: none; flex: 1; font-family: inherit; width: 100%; }
  ::placeholder { color: #5C5C5E; }
</style>
</head>
<body>
<div id="root">

  <div class="list-view" id="listView">
    <div class="sel-header" id="selHeader">
      <button class="icon-btn" id="cancelSelBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="sel-count" id="selCount">0 selected</span>
      <div class="sel-actions">
        <button class="icon-btn" id="selectAllBtn" title="Select all">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <button class="icon-btn" id="deleteSelBtn" title="Delete selected" style="color:#E5534B;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
    <div class="header" id="mainHeader" style="justify-content:flex-end;">
      <button class="icon-btn" id="exportBtn" title="Export all notes" style="color:#E8A33D;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
    <div class="list" id="list"></div>
    <button class="fab" id="newBtn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="editor" id="editorView">
    <div class="editor-header">
      <button class="icon-btn" id="backBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <span class="editor-date" id="editorDate"></span>
      <button class="icon-btn" id="deleteBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
    <div class="editor-body">
      <input id="titleInput" placeholder="Title" />
      <textarea id="bodyInput" placeholder="Note"></textarea>
    </div>
  </div>

</div>

<script>
  const STORAGE_KEY = "notes_app_data";
  let notes = [];
  const NotesStore = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.NotesStore;
  let activeId = null;
  let saveTimer = null;
  let selectMode = false;
  let selectedIds = new Set();
  let longPressTimer = null;

  const listEl = document.getElementById("list");
  const listView = document.getElementById("listView");
  const editorView = document.getElementById("editorView");
  const titleInput = document.getElementById("titleInput");
  const bodyInput = document.getElementById("bodyInput");
  const editorDate = document.getElementById("editorDate");
  const selHeader = document.getElementById("selHeader");
  const mainHeader = document.getElementById("mainHeader");
  const selCount = document.getElementById("selCount");

  // Notes live in a JSON file in app storage (NotesStore plugin).
  // localStorage is kept as a mirror, and as the fallback in a plain browser.
  function save() {
    const data = JSON.stringify(notes);
    try { localStorage.setItem(STORAGE_KEY, data); } catch (e) {}
    if (NotesStore) NotesStore.save({ data }).catch(err => console.error("Save failed:", err));
  }

  async function loadNotes() {
    let data = null;
    if (NotesStore) {
      try { data = (await NotesStore.load()).data; } catch (e) { console.error("Load failed:", e); }
    }
    if (data == null) {
      // First run after the update: move notes over from localStorage.
      data = localStorage.getItem(STORAGE_KEY);
      if (data && NotesStore) NotesStore.save({ data }).catch(() => {});
    }
    try { notes = JSON.parse(data || "[]"); } catch (e) { notes = []; }
  }

  function formatDate(ts) {
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString())
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function render() {
    const sorted = [...notes].sort((a, b) => b.updatedAt - a.updatedAt);
    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty">No notes yet. Tap + to write one.</div>';
    } else {
      listEl.innerHTML = sorted.map(n => { const c = cardText(n); return `
        <div class="card${selectedIds.has(n.id) ? " selected" : ""}" data-id="${n.id}">
          <div class="card-text">
            <div class="card-title">${escapeHtml(c.title)}</div>
            ${c.preview ? `<div class="card-body">${escapeHtml(c.preview)}</div>` : ""}
            <div class="card-date">${formatDate(n.updatedAt)}</div>
          </div>
          <div class="card-check">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      `; }).join("");
      listEl.querySelectorAll(".card").forEach(card => {
        const id = card.dataset.id;
        let startX = 0, startY = 0, moved = false, longPressed = false;

        card.addEventListener("pointerdown", (e) => {
          startX = e.clientX;
          startY = e.clientY;
          moved = false;
          longPressed = false;
          longPressTimer = setTimeout(() => {
            longPressed = true;
            if (!selectMode) enterSelectMode();
            toggleSelect(id);
            if (navigator.vibrate) navigator.vibrate(15);
          }, 400);
        });

        card.addEventListener("pointermove", (e) => {
          if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
            moved = true;
            clearTimeout(longPressTimer);
          }
        });

        const finish = () => {
          clearTimeout(longPressTimer);
          if (longPressed || moved) return;
          if (selectMode) toggleSelect(id);
          else openNote(id);
        };

        card.addEventListener("pointerup", finish);
        card.addEventListener("pointercancel", () => clearTimeout(longPressTimer));
        card.addEventListener("contextmenu", (e) => e.preventDefault());
      });
    }
    updateSelHeader();
  }

  function enterSelectMode() {
    selectMode = true;
    selHeader.classList.add("active");
    mainHeader.classList.add("hidden");
    listEl.classList.add("selecting");
  }

  function exitSelectMode() {
    selectMode = false;
    selectedIds.clear();
    selHeader.classList.remove("active");
    mainHeader.classList.remove("hidden");
    listEl.classList.remove("selecting");
    render();
  }

  function toggleSelect(id) {
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    if (selectedIds.size === 0) { exitSelectMode(); return; }
    render();
  }

  function updateSelHeader() {
    selCount.textContent = `${selectedIds.size} item${selectedIds.size === 1 ? "" : "s"} selected`;
  }

  document.getElementById("cancelSelBtn").addEventListener("click", exitSelectMode);

  document.getElementById("selectAllBtn").addEventListener("click", () => {
    if (selectedIds.size === notes.length) {
      selectedIds.clear();
    } else {
      notes.forEach(n => selectedIds.add(n.id));
    }
    render();
  });

  document.getElementById("deleteSelBtn").addEventListener("click", () => {
    notes = notes.filter(n => !selectedIds.has(n.id));
    save();
    exitSelectMode();
  });

  // Home-screen display only; the stored title stays empty.
  function cardText(n) {
    const title = (n.title || "").trim(), body = (n.body || "").trim();
    if (title) return { title, preview: body.replace(/\s+/g, " ") };
    if (!body) return { title: "Untitled", preview: "" };
    const line = body.split("\n")[0], MAX = 30;
    let cut = line.length <= MAX ? line.length : line.lastIndexOf(" ", MAX);
    if (cut <= 0) cut = Math.min(MAX, line.length);
    return {
      title: line.slice(0, cut).trim() + (cut < line.length ? "…" : ""),
      preview: body.slice(cut).trim().replace(/\s+/g, " ")
    };
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function openNote(id) {
    const n = notes.find(x => x.id === id);
    if (!n) return;
    activeId = id;
    titleInput.value = n.title;
    bodyInput.value = n.body;
    editorDate.textContent = new Date(n.updatedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    listView.classList.add("hidden");
    editorView.classList.add("active");
    setTimeout(() => titleInput.focus(), 50);
  }

  function newNote() {
    if (selectMode) exitSelectMode();
    const now = Date.now();
    const n = { id: now.toString(), title: "", body: "", createdAt: now, updatedAt: now };
    notes.unshift(n);
    save();
    openNote(n.id);
  }

  function flushActive() {
    clearTimeout(saveTimer);
    const n = notes.find(x => x.id === activeId);
    if (!n || (n.title === titleInput.value && n.body === bodyInput.value)) return;
    n.title = titleInput.value;
    n.body = bodyInput.value;
    n.updatedAt = Date.now();
    save();
  }

  function persistActive() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushActive, 200);
  }

  // Save immediately if the app is sent to the background mid-typing.
  document.addEventListener("visibilitychange", () => { if (document.hidden) flushActive(); });

  titleInput.addEventListener("input", persistActive);
  bodyInput.addEventListener("input", persistActive);

  document.getElementById("backBtn").addEventListener("click", () => {
    flushActive();
    const n = notes.find(x => x.id === activeId);
    if (n && !n.title.trim() && !n.body.trim()) {
      notes = notes.filter(x => x.id !== activeId);
      save();
    }
    editorView.classList.remove("active");
    listView.classList.remove("hidden");
    render();
  });

  document.getElementById("deleteBtn").addEventListener("click", () => {
    notes = notes.filter(x => x.id !== activeId);
    save();
    editorView.classList.remove("active");
    listView.classList.remove("hidden");
    render();
  });

  document.getElementById("newBtn").addEventListener("click", newNote);

  document.getElementById("exportBtn").addEventListener("click", async () => {
    const sorted = [...notes].sort((a, b) => a.createdAt - b.createdAt);
    const text = sorted.map(n => {
      const d = new Date(n.createdAt).toLocaleString([], { year: "numeric", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
      return `${n.title || "Untitled"}\n${d}\n${"-".repeat(20)}\n${n.body || ""}\n`;
    }).join("\n" + "=".repeat(40) + "\n\n");
    const fileName = `notes-export-${new Date().toISOString().slice(0, 10)}.txt`;
    const { SaveAs } = Capacitor.Plugins;
    try {
      await SaveAs.saveAs({ fileName, data: text });
    } catch (err) {
      if (err && err.message !== "Save canceled") {
        console.error("Export failed:", err);
      }
    }
  });

  loadNotes().then(render);
</script>
</body>
</html>
