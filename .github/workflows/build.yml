name: Build Dragon Run APK

on:
  push:
    branches: [dino-game]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DragonRun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DragonRun-apk
          path: DragonRun.apk

      # A fixed "dragon-run" release always holds the newest APK, so the
      # download link never changes (and never clashes with main's releases).
      - name: Move dragon-run tag to this commit
        run: |
          git tag -f dragon-run
          git push -f origin dragon-run

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dragon-run
          name: Dragon Run (latest build)
          body: |
            Download **DragonRun.apk** below and open it on your Android phone (Android 8.0+).
            Build #${{ github.run_number }} from commit ${{ github.sha }}.
          files: DragonRun.apk
          overwrite_files: true
          make_latest: false
