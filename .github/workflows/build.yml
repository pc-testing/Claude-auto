name: Build Pixel Arcade APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PixelArcade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PixelArcade-apk
          path: PixelArcade.apk

      # The fixed "pixel-arcade" release always holds the newest APK,
      # so the download link in the README never changes.
      - name: Move pixel-arcade tag to this commit
        run: |
          git tag -f pixel-arcade
          git push -f origin pixel-arcade

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixel-arcade
          name: Pixel Arcade (latest build)
          body: |
            Download **PixelArcade.apk** below and open it on your Android phone (Android 8.0+).
            14 offline games in one app. Build #${{ github.run_number }} from commit ${{ github.sha }}.
          files: PixelArcade.apk
          overwrite_files: true
          make_latest: true
