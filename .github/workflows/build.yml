name: Build Notes APK

on:
  push:
    branches: [notes-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install & sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Notes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Notes-apk
          path: Notes.apk

      # Fixed "notes-app-latest" release always holds the newest APK,
      # so the README download link never changes.
      - name: Move tag to this commit
        run: |
          git tag -f notes-app-latest
          git push -f origin notes-app-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notes-app-latest
          name: Notes (latest build)
          body: |
            Download **Notes.apk** below and open it on your Android phone (Android 6.0+).
            Build #${{ github.run_number }} from commit ${{ github.sha }}.
          files: Notes.apk
          overwrite_files: true
          make_latest: false
