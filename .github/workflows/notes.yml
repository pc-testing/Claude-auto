name: Build Notes APK

on:
  push:
    branches: [notes-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install & sync Capacitor
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      # Keep package-lock.json in step with package.json.
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update package-lock.json [skip ci]" package-lock.json
            git push origin HEAD:notes-app
          fi

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            ./gradlew assembleDebug --no-daemon   # still check the code compiles
            echo "::error::Add the KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Notes.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Notes-apk
          path: Notes.apk

      # Fixed "notes-app-latest" release always holds the newest APK,
      # so the README download link never changes.
      - name: Move tag to this commit
        run: |
          git tag -f notes-app-latest
          git push -f origin notes-app-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notes-app-latest
          name: Notes (latest build)
          body: |
            Download **Notes.apk** below and open it on your Android phone (Android 7.0+).
            Version 1.0.${{ github.run_number }}, from commit ${{ github.sha }}.
          files: Notes.apk
          overwrite_files: true
          make_latest: false
