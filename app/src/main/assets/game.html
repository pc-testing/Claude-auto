<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dragon Run</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7f7f7;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- World constants (logical units; world height is fixed) ----------
  var H = 200;                // logical world height
  var GROUND = 168;           // y of the ground line
  var PX = 2;                 // one sprite pixel = 2 world units
  var GRAVITY = 2600;
  var JUMP_V = -770;
  var MIN_JUMP_V = -420;      // releasing early cuts the jump short
  var START_SPEED = 380;
  var MAX_SPEED = 860;
  var ACCEL = 9;              // speed gained per second

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 600, scale = 1, dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    var cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    // Fit the fixed-height world; in portrait keep the world reasonably wide.
    scale = canvas.height / H;
    W = canvas.width / scale;
    if (W < 420) { scale = canvas.width / 420; W = 420; }
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Sprites (original pixel art) ----------
  // '#' = body colour, 'w' = wing (accent), 'o' = eye (background colour)
  var BODY = [
    '................#..#....',
    '...............######...',
    '..............##o######.',
    '..............#########.',
    '..............########..',
    '..............####......',
    '..............#######...',
    '.....ww......#####......',
    '....wwww....######......',
    '...wwwwww..########.....',
    '..wwwwwww##########.....',
    '#..wwww############.....',
    '##..ww############.#....',
    '.##..############..#....',
    '..##############........',
    '...###########..........'
  ];
  var LEGS_STAND = ['....###..###............', '....##....##............', '....#.....#.............', '....##....##............'];
  var LEGS_A     = ['....###..###............', '....##....##............', '....##....#.............', '..........##............'];
  var LEGS_B     = ['....###..###............', '....##....##............', '....#.....##............', '....##..................'];
  var DUCK_BODY = [
    '.........................#..#.',
    '......ww................######',
    '.....wwww..............##o#####',
    '#...wwwwww#####################',
    '##.wwwwwww###################..',
    '.##.wwww#####################..',
    '..###########################..',
    '...##################....####..'
  ];
  var DUCK_A = ['....###..###..', '....##....#...', '..........##..'];
  var DUCK_B = ['....###..###..', '....#.....##..', '....##........'];

  var DRAGON_RUN_A = BODY.concat(LEGS_A);
  var DRAGON_RUN_B = BODY.concat(LEGS_B);
  var DRAGON_STAND = BODY.concat(LEGS_STAND);
  var DRAGON_DUCK_A = DUCK_BODY.concat(DUCK_A);
  var DRAGON_DUCK_B = DUCK_BODY.concat(DUCK_B);

  var BIRD_UP = [
    '......#...........',
    '......##..........',
    '......###.........',
    '...#..####........',
    '..##..#####.......',
    '.###############..',
    '#################.',
    '......##########..',
    '..................',
    '..................'
  ];
  var BIRD_DOWN = [
    '..................',
    '..................',
    '..................',
    '...#..............',
    '..##..............',
    '.###############..',
    '#################.',
    '......##########..',
    '......#####.......',
    '......###.........',
    '......##..........',
    '......#...........'
  ];

  function drawSprite(rows, x, y, body, wing, eye) {
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      for (var c = 0; c < row.length; c++) {
        var ch = row.charAt(c);
        if (ch === '.') continue;
        ctx.fillStyle = ch === '#' ? body : ch === 'w' ? wing : eye;
        ctx.fillRect(x + c * PX, y + r * PX, PX + 0.05, PX + 0.05);
      }
    }
  }

  // ---------- Audio ----------
  var audio = null;
  var muted = false;
  try { muted = localStorage.getItem('dragon_muted') === '1'; } catch (e) {}
  function ensureAudio() {
    if (audio) { if (audio.state === 'suspended') audio.resume(); return; }
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function beep(freq, dur, type, vol, slideTo) {
    if (!audio || muted) return;
    var t = audio.currentTime;
    var o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sJump() { beep(520, 0.12, 'square', 0.06, 900); }
  function sPoint() { beep(880, 0.08, 'square', 0.05); setTimeout(function () { beep(1320, 0.12, 'square', 0.05); }, 90); }
  function sDie() { beep(300, 0.35, 'sawtooth', 0.08, 60); }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- State ----------
  var STATE_READY = 0, STATE_RUN = 1, STATE_OVER = 2;
  var state = STATE_READY;
  var hi = 0;
  try { hi = parseInt(localStorage.getItem('dragon_hi') || '0', 10) || 0; } catch (e) {}

  var dragon, obstacles, clouds, stars, bumps, speed, score, distToNext, runTime,
      overTime, flashUntil, nextMilestone, night, nightT, nextNightAt, paused;

  function reset() {
    dragon = { x: 30, y: GROUND - 40, vy: 0, onGround: true, ducking: false, holding: false, anim: 0 };
    obstacles = [];
    speed = START_SPEED;
    score = 0;
    distToNext = 500;
    runTime = 0;
    flashUntil = 0;
    nextMilestone = 100;
    night = false; nightT = 0; nextNightAt = 700;
    paused = false;
  }
  function initScenery() {
    clouds = [];
    for (var i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 25 + Math.random() * 60 });
    stars = [];
    for (var s = 0; s < 14; s++) stars.push({ x: Math.random() * 1600, y: 10 + Math.random() * 90, tw: Math.random() * 6 });
    bumps = [];
    for (var b = 0; b < 40; b++) bumps.push({ x: Math.random() * 1600, y: GROUND + 4 + Math.random() * 20, w: 2 + Math.random() * 6 });
  }
  reset();
  initScenery();

  // ---------- Dragon ----------
  function dragonHeight() { return dragon.ducking && dragon.onGround ? 22 : 40; }
  function dragonBoxes() {
    // A few rectangles roughly covering the sprite, for fair collisions.
    var x = dragon.x, y = dragon.y;
    if (dragon.ducking && dragon.onGround) {
      return [{ x: x + 6, y: y + 6, w: 50, h: 12 }, { x: x + 46, y: y + 1, w: 14, h: 8 }];
    }
    return [
      { x: x + 28, y: y + 2, w: 18, h: 12 },  // head
      { x: x + 10, y: y + 14, w: 28, h: 16 }, // body
      { x: x + 8, y: y + 30, w: 18, h: 9 }    // legs
    ];
  }
  function jump() {
    if (state !== STATE_RUN) return;
    if (dragon.onGround) {
      dragon.vy = JUMP_V; dragon.onGround = false; dragon.ducking = false; sJump();
    }
  }
  function releaseJump() {
    dragon.holding = false;
    if (!dragon.onGround && dragon.vy < MIN_JUMP_V) dragon.vy = MIN_JUMP_V;
  }
  function setDuck(on) {
    dragon.ducking = on;
    if (on && !dragon.onGround && dragon.vy < 600) dragon.vy = 600; // fast fall
  }

  // ---------- Obstacles ----------
  function spawnObstacle() {
    var canBird = score > 300;
    var r = Math.random();
    var o;
    if (canBird && r < 0.25) {
      var heights = [GROUND - 30, GROUND - 52, GROUND - 76];
      o = { type: 'bird', x: W + 20, y: heights[Math.floor(Math.random() * 3)], w: 36, h: 18, flap: 0, extra: 60 };
    } else {
      var big = Math.random() < 0.45;
      var maxCount = speed > 600 ? 3 : speed > 460 ? 2 : 1;
      var count = 1 + Math.floor(Math.random() * maxCount);
      var cw = big ? 18 : 12, ch = big ? 46 : 32;
      var parts = [];
      for (var i = 0; i < count; i++) parts.push({ dx: i * (cw + 3), h: ch - (i % 2) * (big ? 6 : 4) });
      o = { type: 'cactus', x: W + 20, y: GROUND - ch, w: count * (cw + 3) - 3, h: ch, cw: cw, big: big, parts: parts, extra: 0 };
    }
    obstacles.push(o);
    // Gap scales with speed so jumps stay possible.
    var minGap = speed * 0.62 + o.w + (o.extra || 0);
    distToNext = minGap + Math.random() * (speed * 0.9);
  }
  function obstacleBoxes(o) {
    if (o.type === 'bird') return [{ x: o.x + 2, y: o.y + 10, w: o.w - 4, h: 6 }, { x: o.x + 12, y: o.y + 2, w: 10, h: 14 }];
    var boxes = [];
    for (var i = 0; i < o.parts.length; i++) {
      var p = o.parts[i];
      boxes.push({ x: o.x + p.dx + 3, y: GROUND - p.h + 2, w: o.cw - 6, h: p.h - 2 });
      boxes.push({ x: o.x + p.dx, y: GROUND - p.h * 0.7, w: o.cw, h: p.h * 0.35 }); // arms
    }
    return boxes;
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  // ---------- Update ----------
  function update(dt) {
    if (state === STATE_RUN && !paused) {
      runTime += dt;
      speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
      score += speed * dt / 40;

      if (score >= nextMilestone) { nextMilestone += 100; flashUntil = runTime + 0.9; sPoint(); }
      if (score >= nextNightAt) { night = !night; nextNightAt += 700; }

      // Dragon physics
      if (!dragon.onGround) {
        dragon.vy += GRAVITY * dt;
        dragon.y += dragon.vy * dt;
        if (dragon.y >= GROUND - 40) { dragon.y = GROUND - 40; dragon.vy = 0; dragon.onGround = true; }
      }
      dragon.anim += dt * (speed / 40);

      // Obstacles
      distToNext -= speed * dt;
      if (distToNext <= 0) spawnObstacle();
      for (var i = obstacles.length - 1; i >= 0; i--) {
        var o = obstacles[i];
        o.x -= (speed + (o.type === 'bird' ? 40 : 0)) * dt;
        if (o.type === 'bird') o.flap += dt;
        if (o.x + o.w < -20) obstacles.splice(i, 1);
      }

      // Collision
      var db = dragonBoxes();
      outer:
      for (var j = 0; j < obstacles.length; j++) {
        var ob = obstacleBoxes(obstacles[j]);
        for (var a = 0; a < db.length; a++) for (var b = 0; b < ob.length; b++) {
          if (hit(db[a], ob[b])) { gameOver(); break outer; }
        }
      }
    }

    var sp = state === STATE_RUN && !paused ? speed : 0;
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x -= (sp * 0.12 + (state === STATE_RUN ? 0 : 6)) * dt;
      if (clouds[c].x < -60) { clouds[c].x = W + Math.random() * 200; clouds[c].y = 25 + Math.random() * 60; }
    }
    groundOffset = (groundOffset + sp * dt) % 1600;
    // Night fades in/out smoothly
    nightT += ((night ? 1 : 0) - nightT) * Math.min(1, dt * 2.5);
  }
  var groundOffset = 0;

  function gameOver() {
    state = STATE_OVER;
    overTime = performance.now();
    var s = Math.floor(score);
    if (s > hi) { hi = s; try { localStorage.setItem('dragon_hi', String(hi)); } catch (e) {} }
    sDie(); vibrate(120);
  }

  // ---------- Draw ----------
  function mix(a, b, t) {
    var r = Math.round(a[0] + (b[0] - a[0]) * t), g = Math.round(a[1] + (b[1] - a[1]) * t), bl = Math.round(a[2] + (b[2] - a[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  var DAY_BG = [247, 247, 247], NIGHT_BG = [24, 26, 38];
  var DAY_FG = [83, 83, 83], NIGHT_FG = [222, 222, 222];
  var DAY_WING = [63, 168, 110], NIGHT_WING = [120, 220, 160];

  function pad(n) { var s = String(Math.floor(n)); while (s.length < 5) s = '0' + s; return s; }

  function draw() {
    var bg = mix(DAY_BG, NIGHT_BG, nightT), fg = mix(DAY_FG, NIGHT_FG, nightT), wing = mix(DAY_WING, NIGHT_WING, nightT);
    document.body.style.background = bg;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    var offY = (canvas.height / scale - H) / 2; // centre vertically in portrait
    ctx.setTransform(scale, 0, 0, scale, 0, offY * scale);

    // Stars & moon at night
    if (nightT > 0.05) {
      ctx.globalAlpha = nightT;
      ctx.fillStyle = '#f5f3ce';
      var mx = W * 0.75;
      ctx.beginPath(); ctx.arc(mx, 38, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(mx + 6, 34, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var sx = ((st.x - groundOffset * 0.03) % W + W) % W;
        var blink = 0.5 + 0.5 * Math.sin(performance.now() / 400 + st.tw);
        ctx.globalAlpha = nightT * (0.4 + 0.6 * blink);
        ctx.fillRect(sx, st.y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    // Clouds
    ctx.fillStyle = mix([210, 210, 210], [70, 74, 92], nightT);
    for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c].x, clouds[c].y);

    // Ground
    ctx.fillStyle = fg;
    ctx.fillRect(0, GROUND, W, 1.5);
    for (var b = 0; b < bumps.length; b++) {
      var bp = bumps[b];
      var bx = ((bp.x - groundOffset) % 1600 + 1600) % 1600;
      if (bx < W) ctx.fillRect(bx, bp.y, bp.w, 1.2);
    }

    // Obstacles
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      if (o.type === 'bird') {
        drawSprite(Math.floor(o.flap * 6) % 2 ? BIRD_DOWN : BIRD_UP, o.x, o.y - 4, fg, fg, bg);
      } else {
        for (var p = 0; p < o.parts.length; p++) drawCactus(o.x + o.parts[p].dx, o.cw, o.parts[p].h, fg);
      }
    }

    // Dragon
    var sprite;
    if (state === STATE_OVER) sprite = DRAGON_STAND;
    else if (!dragon.onGround || state === STATE_READY) sprite = DRAGON_STAND;
    else if (dragon.ducking) sprite = Math.floor(dragon.anim) % 2 ? DRAGON_DUCK_A : DRAGON_DUCK_B;
    else sprite = Math.floor(dragon.anim) % 2 ? DRAGON_RUN_A : DRAGON_RUN_B;
    var dy = dragon.ducking && dragon.onGround ? GROUND - 22 : dragon.y;
    var readyBob = state === STATE_READY ? Math.round(Math.sin(performance.now() / 300) * 1) : 0;
    drawSprite(sprite, dragon.x, dy + readyBob, fg, wing, state === STATE_OVER ? '#e74c3c' : bg);
    if (state === STATE_OVER) { // X eye
      ctx.fillStyle = bg; ctx.fillRect(dragon.x + 32, dy + 4, 2, 2);
    }

    // Score
    ctx.fillStyle = fg;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 14px "Courier New", monospace';
    var flashing = state === STATE_RUN && runTime < flashUntil && Math.floor(runTime * 8) % 2 === 0;
    var scoreText = pad(state === STATE_RUN && flashing ? nextMilestone - 100 : score);
    if (!(state === STATE_RUN && runTime < flashUntil && !flashing)) {} // keep visible
    ctx.globalAlpha = flashing ? 0.25 : 1;
    ctx.fillText(scoreText, W - 12, 10);
    ctx.globalAlpha = 1;
    if (hi > 0) {
      ctx.globalAlpha = 0.6;
      ctx.fillText('HI ' + pad(hi), W - 12 - 70, 10);
      ctx.globalAlpha = 1;
    }

    // Sound toggle (top-left)
    drawSpeaker(14, 10, fg);

    ctx.textAlign = 'center';
    if (state === STATE_READY) {
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('DRAGON RUN', W / 2, 54);
      ctx.font = '11px "Courier New", monospace';
      var blinkOn = Math.floor(performance.now() / 500) % 2 === 0;
      if (blinkOn) ctx.fillText('TAP TO START', W / 2, 82);
      ctx.globalAlpha = 0.7;
      ctx.fillText('Tap = jump   •   Swipe down & hold = duck', W / 2, 100);
      ctx.globalAlpha = 1;
    } else if (state === STATE_OVER) {
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 52);
      drawRestart(W / 2, 96, fg);
      if (Math.floor(score) >= hi && hi > 0) {
        ctx.font = '11px "Courier New", monospace';
        ctx.fillText('NEW HIGH SCORE!', W / 2, 122);
      }
    } else if (paused) {
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText('PAUSED - TAP TO RESUME', W / 2, 70);
    }
  }

  function drawCloud(x, y) {
    ctx.fillRect(x + 8, y, 24, 4);
    ctx.fillRect(x + 4, y + 4, 34, 4);
    ctx.fillRect(x, y + 8, 46, 4);
  }
  function drawCactus(x, w, h, col) {
    ctx.fillStyle = col;
    var top = GROUND - h;
    var stem = Math.round(w * 0.42);
    var sx = x + (w - stem) / 2;
    ctx.fillRect(sx, top + 2, stem, h - 2);
    ctx.fillRect(sx + 1, top, stem - 2, 2);
    var armW = Math.max(2, Math.round(w * 0.2));
    // left arm
    ctx.fillRect(x, top + h * 0.28, armW, h * 0.3);
    ctx.fillRect(x, top + h * 0.52, sx - x, armW);
    // right arm
    ctx.fillRect(x + w - armW, top + h * 0.2, armW, h * 0.28);
    ctx.fillRect(sx + stem, top + h * 0.42, x + w - armW - (sx + stem) + armW, armW);
  }
  function drawRestart(cx, cy, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 11, -Math.PI * 0.35, Math.PI * 1.45); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath();
    var ax = cx + 11 * Math.cos(-Math.PI * 0.35), ay = cy + 11 * Math.sin(-Math.PI * 0.35);
    ctx.moveTo(ax + 5, ay - 6); ctx.lineTo(ax + 5, ay + 4); ctx.lineTo(ax - 5, ay - 2); ctx.closePath(); ctx.fill();
  }
  function drawSpeaker(x, y, col) {
    ctx.fillStyle = col; ctx.globalAlpha = 0.6;
    ctx.fillRect(x, y + 4, 4, 6);
    ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 10, y); ctx.lineTo(x + 10, y + 14); ctx.lineTo(x + 4, y + 10); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    if (muted) { ctx.beginPath(); ctx.moveTo(x + 13, y + 3); ctx.lineTo(x + 20, y + 11); ctx.moveTo(x + 20, y + 3); ctx.lineTo(x + 13, y + 11); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + 11, y + 7, 5, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 11, y + 7, 9, -0.9, 0.9); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

  // ---------- Input ----------
  function toWorld(clientX, clientY) {
    var offY = (canvas.height / scale - H) / 2;
    return { x: clientX * dpr / scale, y: clientY * dpr / scale - offY };
  }
  function onPress(wx, wy) {
    ensureAudio();
    if (wx < 40 && wy < 34) { // sound toggle
      muted = !muted;
      try { localStorage.setItem('dragon_muted', muted ? '1' : '0'); } catch (e) {}
      return;
    }
    if (state === STATE_READY) { reset(); state = STATE_RUN; jump(); dragon.holding = true; return; }
    if (state === STATE_OVER) {
      if (performance.now() - overTime > 600) { reset(); state = STATE_RUN; }
      return;
    }
    if (paused) { paused = false; return; }
    dragon.holding = true;
    jump();
  }

  var touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY, id: t.identifier, ducked: false };
    var w = toWorld(t.clientX, t.clientY);
    // Defer the jump slightly isn't needed: jump immediately for responsiveness.
    onPress(w.x, w.y);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!touchStart || state !== STATE_RUN) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier !== touchStart.id) continue;
      if (t.clientY - touchStart.y > 25 * (window.innerHeight / 400)) {
        if (!touchStart.ducked) { touchStart.ducked = true; releaseJump(); setDuck(true); }
      }
    }
  }, { passive: false });
  function endTouch(e) {
    e.preventDefault();
    if (touchStart && touchStart.ducked) setDuck(false);
    releaseJump();
    touchStart = null;
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  // Mouse & keyboard (for desktop testing)
  canvas.addEventListener('mousedown', function (e) {
    if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
    var w = toWorld(e.clientX, e.clientY); onPress(w.x, w.y);
  });
  canvas.addEventListener('mouseup', function () { releaseJump(); });
  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onPress(W / 2, 100); }
    if (e.code === 'ArrowDown') { e.preventDefault(); if (state === STATE_RUN) setDuck(true); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') releaseJump();
    if (e.code === 'ArrowDown') setDuck(false);
  });

  // Pause when the app goes to background
  function pause() { if (state === STATE_RUN) paused = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) pause(); });
  window.dragonPause = pause;

  // ---------- Loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Test hook
  window.__dragon = { get state() { return state; }, get score() { return score; }, get obstacles() { return obstacles; }, get dragon() { return dragon; } };
})();
</script>
