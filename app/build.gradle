plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace = 'com.pctesting.photoeditor'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.pctesting.photoeditor"
        minSdk = 26
        targetSdk = 34
        versionCode = runNumber
        versionName = "1.0." + runNumber
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the build machine's debug key so the APK installs directly.
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}
